# Bundle patch layer for dsh-inject-context.
#
# A single `insert` row loads this package's main entry as the host half
# (a plain Cordis plugin). This package ships no Config schema, so the `config:`
# block below is passed verbatim to `apply(ctx, config)`; omitted keys fall back
# to the defaults in lib/index.js.
- insert:
    - id: dsh-inject-context
      name: dsh-inject-context
      config:
        # 检索阈值 0~1（越高要求越相关）与条数，随请求体发给 OpenViking find。
        scoreThreshold: 0.4
        limit: 3
